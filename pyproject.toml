[project]
name = "buildwithx"
version = "0.1.0"
description = "Personal blog platform"
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.136.3",
    "gunicorn>=26.0.0",
    "motor>=3.7.1",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.13.0",
    "pymongo[srv]>=4.17.0",
    "python-multipart>=0.0.29",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.48.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.14"
disable_error_code = ["attr-defined"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "black>=26.5.1",
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pre-commit>=4.3.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
